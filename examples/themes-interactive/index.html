<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hydrogen.Themes — interactive port</title>
    <link rel="stylesheet" href="style.css" />
    <!-- The theme context lives on <body> (not a nested div) so the body-level portal
         roots the overlays adopt into also inherit it. Inter on every .radix-themes root. -->
    <style>.radix-themes { --default-font-family: 'Inter Variable', sans-serif; }</style>
  </head>
  <body
    class="radix-themes light"
    data-accent-color="indigo"
    data-gray-color="slate"
    data-radius="medium"
    data-scaling="100%"
    data-has-background="true"
    data-panel-background="translucent"
    style="--default-font-family: 'Inter Variable', sans-serif"
  >
    <!-- The app mounts in #root (mirrors the golden's structure so the shared Playwright
         state driver — which scopes the trigger to #root — works against both). Portaled
         overlays still adopt into <body>, inheriting the theme set on it above. -->
    <div id="root"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
