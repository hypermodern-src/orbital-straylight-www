package:
  name: straylight-web
  dependencies:
    - aff
    - arrays
    - console
    - effect
    - foldable-traversable
    - halogen
    - halogen-vdom
    - hydrogen
    - hydrogen-supabase
    - maybe
    - prelude
    - strings
    - web-dom
    - web-html
    - web-events
  bundle:
    platform: browser
    type: app
    module: Main
    outfile: ../public/straylight.js

workspace:
  packageSet:
    registry: 73.2.0
  extraPackages:
    hydrogen:
      path: ../../hydrogen
    hydrogen-supabase:
      path: ../../hydrogen/integrations/supabase
