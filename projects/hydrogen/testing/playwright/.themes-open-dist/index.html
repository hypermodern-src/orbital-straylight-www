<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hydrogen.Themes — interactive port</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Inter on every .radix-themes root (the root theme div + each re-themed portal),
         matching the golden. The body itself is BARE (theme lives on a nested div, exactly
         like upstream); the app renders the theme div inside #root and re-applies the theme
         classes/attrs on each portaled overlay so adopted-to-body content stays themed. -->
    <style>.radix-themes { --default-font-family: 'Inter Variable', sans-serif; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
