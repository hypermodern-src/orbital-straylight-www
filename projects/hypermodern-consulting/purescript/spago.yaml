# hypermodern.consulting — the ORBITAL deck mock, reproduced on hydrogen.
package:
  name: hypermodern-consulting
  dependencies:
    - aff
    - arrays
    - console
    - effect
    - foldable-traversable
    - halogen
    - halogen-subscriptions
    - hydrogen
    - integers
    - maybe
    - prelude
    - refs
    - strings
    - web-dom
    - web-events
    - web-html
    - web-uievents
  bundle:
    platform: browser
    type: app
    module: Main
    outfile: ../dist/deck.js

workspace:
  packageSet:
    registry: 73.2.0
  extraPackages:
    hydrogen:
      git: ssh://git@git.s4.gl/straylight/hydrogen.git
      ref: 8afd5e6358609e8532bdef56e2f21545064df8cc
